name: Playwright E2E Tests

# Disabled: tests stale after recent UI/i18n refactor.
# Triggered manually only until tests are updated to match new UI.
on:
  workflow_dispatch:

jobs:
  test:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Next.js app (server mode for tests)
        run: npm run build
        env:
          NEXT_PUBLIC_MSW: 'true'
          # NEXT_STATIC_EXPORT no seteado → modo server (necesario para next start)

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          CI: 'true'
          NEXT_PUBLIC_MSW: 'true'

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
